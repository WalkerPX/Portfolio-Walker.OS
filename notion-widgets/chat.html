<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat with Joi</title>
<style>
  :root { --crimson:#990000; --cream:#F5EFE0; }
  * { margin:0; box-sizing:border-box; }
  body { font-family: Georgia, 'Times New Roman', serif; background: var(--crimson); color: var(--cream);
         display:flex; align-items:center; justify-content:center; min-height:100vh; padding:12px; }
  .chat { width:100%; max-width:560px; background:#fffdf7; border:2px solid var(--cream);
          border-radius:16px; overflow:hidden; display:flex; flex-direction:column;
          height:70vh; min-height:380px; box-shadow:0 10px 28px rgba(0,0,0,.4); }
  .hd { background:linear-gradient(160deg,#7a0000, var(--crimson) 60%, #b31b1b);
        color:var(--cream); padding:12px 16px; display:flex; align-items:center; gap:8px; }
  .hd .tr { font-size:18px; }
  .hd b { font-size:14px; letter-spacing:1px; }
  .hd span { font-size:11px; opacity:.75; margin-left:auto; }
  .msgs { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .m { max-width:85%; padding:9px 13px; border-radius:14px; font-size:13.5px; line-height:1.5; white-space:pre-wrap; word-wrap:break-word; }
  .u { align-self:flex-end; background:var(--crimson); color:var(--cream); border-bottom-right-radius:4px; }
  .j { align-self:flex-start; background:#f1e9d8; color:#3a2a1a; border-bottom-left-radius:4px; }
  .typing { opacity:.6; font-style:italic; }
  .in { display:flex; gap:8px; padding:12px; background:#faf5ea; border-top:1px solid rgba(153,0,0,.15); }
  textarea { flex:1; resize:none; border:1px solid rgba(153,0,0,.3); border-radius:10px; padding:9px 12px;
             font-family:inherit; font-size:13.5px; color:#3a2a1a; background:#fff; max-height:90px; }
  textarea:focus { outline:2px solid rgba(153,0,0,.4); }
  button { background:var(--crimson); color:var(--cream); border:none; border-radius:10px; padding:0 18px;
           font-family:inherit; font-size:13px; letter-spacing:1px; cursor:pointer; }
  button:hover { opacity:.9; }
  button:disabled { opacity:.5; cursor:wait; }
  .err { font-size:11px; color:#8a1a1a; padding:0 14px 6px; display:none; }
</style>
</head>
<body>
  <div class="chat">
    <div class="hd"><span class="tr">🔱</span><b>Joi — Secretary</b><span id="ver">v3</span></div>
    <div class="msgs" id="msgs"></div>
    <div class="err" id="err"></div>
    <div class="in">
      <textarea id="inp" rows="1" placeholder="Ask me anything — add an event, check your schedule, file homework…"></textarea>
      <button id="send">Send</button>
    </div>
  </div>
<script>
const params = new URLSearchParams(location.search);
const API_BASE = params.get('api') || 'https://truenas.tail94e08b.ts.net:8443';
const KEY = params.get('key') || '';
const LS = 'joi-chat-session';
let sessionId = localStorage.getItem(LS) || null;

const msgs = document.getElementById('msgs');
const inp = document.getElementById('inp');
const sendBtn = document.getElementById('send');
const errBox = document.getElementById('err');

function addMsg(text, who){
  const d = document.createElement('div');
  d.className = 'm ' + (who === 'u' ? 'u' : 'j');
  d.textContent = text;
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
  return d;
}
function setTyping(on){
  let t = document.getElementById('typing');
  if(on && !t){ t = addMsg('Joi is thinking…', 'j'); t.id = 'typing'; t.className += ' typing'; }
  else if(!on && t){ t.remove(); }
}

async function send(){
  const text = inp.value.trim();
  if(!text) return;
  inp.value = '';
  errBox.style.display = 'none';
  addMsg(text, 'u');
  setTyping(true);
  sendBtn.disabled = true;
  try{
    const headers = {'Content-Type':'application/json'};
    if(KEY) headers['Authorization'] = 'Bearer ' + KEY;
    if(sessionId) headers['X-Hermes-Session-Id'] = sessionId;
    const r = await fetch(API_BASE + '/v1/chat/completions', {
      method:'POST', headers, body: JSON.stringify({
        model:'hermes-agent',
        messages:[{role:'user', content:text}]
      })
    });
    const sid = r.headers.get('X-Hermes-Session-Id');
    if(sid) { sessionId = sid; localStorage.setItem(LS, sid); }
    const d = await r.json();
    if(!r.ok){ throw new Error(d.error?.message || ('HTTP ' + r.status)); }
    const reply = d.choices?.[0]?.message?.content || '(no response)';
    setTyping(false);
    addMsg(reply, 'j');
  }catch(e){
    setTyping(false);
    errBox.textContent = 'Error: ' + e.message + ' [' + API_BASE + ']' + (KEY ? '' : ' (no key — add ?key= to the embed URL)');
    errBox.style.display = 'block';
  }finally{
    sendBtn.disabled = false;
    inp.focus();
  }
}

sendBtn.onclick = send;
inp.addEventListener('keydown', e => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); } });
addMsg('Hey Walker — Joi here. What do you need?', 'j');
inp.focus();
</script>
</body>
</html>
