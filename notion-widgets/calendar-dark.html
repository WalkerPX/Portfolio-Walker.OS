<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly Schedule</title>
<style>
  :root { --crimson:#990000; --cream:#F5EFE0; }
  * { margin:0; box-sizing:border-box; }
  body { font-family: Georgia, 'Times New Roman', serif; background:#160303;
         color:var(--cream); min-height:100vh; padding:12px; }
  .hd { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .hd .tr { font-size:18px; }
  .hd span { font-size:12px; letter-spacing:2px; text-transform:uppercase; opacity:.85; }
  .wrap { background:#1d0a0a; border:1px solid rgba(245,239,224,.15); border-radius:14px; overflow:hidden; }
  iframe { width:100%; height:560px; border:none; display:block;
           filter: invert(0.92) hue-rotate(180deg) contrast(0.92) saturate(0.9); }
</style>
</head>
<body>
  <div class="hd"><span class="tr">🔱</span><span>Weekly Schedule — Walker</span></div>
  <div class="wrap">
    <iframe src="https://calendar.google.com/calendar/embed?src=walker.birchfield03%40gmail.com&ctz=America%2FNew_York&mode=WEEK" loading="lazy"></iframe>
  </div>
</body>
</html>
