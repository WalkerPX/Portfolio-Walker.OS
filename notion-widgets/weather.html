<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indianapolis Weather</title>
<style>
  :root { --crimson:#990000; --cream:#F5EFE0; }
  * { margin:0; box-sizing:border-box; }
  body { font-family: Georgia, 'Times New Roman', serif; background: var(--crimson); color: var(--cream);
         display:flex; align-items:center; justify-content:center; min-height:100vh; padding:14px; }
  .card { background: linear-gradient(160deg, #7a0000 0%, var(--crimson) 60%, #b31b1b 100%);
          border: 2px solid var(--cream); border-radius: 18px; padding: 22px 26px; width:100%; max-width:420px;
          box-shadow: 0 8px 24px rgba(0,0,0,.35); text-align:center; }
  .trident { font-size: 24px; margin-bottom: 4px; }
  .city { font-size: 14px; letter-spacing: 2px; text-transform: uppercase; opacity:.85; }
  .temp { font-size: 62px; font-weight: bold; line-height:1.1; margin: 4px 0 2px; }
  .cond { font-size: 17px; font-style: italic; opacity:.95; }
  .grid { display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 16px; padding-top: 12px;
          border-top: 1px solid rgba(245,239,224,.35); }
  .grid div span { display:block; font-size: 10px; letter-spacing:1px; text-transform:uppercase; opacity:.7; }
  .grid div b { font-size: 16px; }
  .updated { font-size: 10px; opacity:.55; margin-top: 12px; }
</style>
</head>
<body>
  <div class="card">
    <div class="trident">🔱</div>
    <div class="city">Indianapolis, IN</div>
    <div class="temp" id="temp">—°</div>
    <div class="cond" id="cond">Loading…</div>
    <div class="grid">
      <div><span>Feels</span><b id="feels">—</b></div>
      <div><span>Humidity</span><b id="hum">—</b></div>
      <div><span>Wind</span><b id="wind">—</b></div>
    </div>
    <div class="updated" id="upd"></div>
  </div>
<script>
const CODES = {0:'Clear sky',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Rime fog',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',66:'Freezing rain',67:'Freezing rain',71:'Light snow',73:'Snow',75:'Heavy snow',77:'Snow grains',80:'Light showers',81:'Showers',82:'Heavy showers',85:'Snow showers',86:'Snow showers',95:'Thunderstorm',96:'Thunderstorm w/ hail',99:'Thunderstorm w/ hail'};
async function load(){
  try{
    const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=39.7684&longitude=-86.1581&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph');
    const d = await r.json();
    const c = d.current;
    document.getElementById('temp').textContent = Math.round(c.temperature_2m) + '\u00b0';
    document.getElementById('cond').textContent = CODES[c.weather_code] || '\u2014';
    document.getElementById('feels').textContent = Math.round(c.apparent_temperature) + '\u00b0';
    document.getElementById('hum').textContent = c.relative_humidity_2m + '%';
    document.getElementById('wind').textContent = Math.round(c.wind_speed_10m) + ' mph';
    document.getElementById('upd').textContent = 'Updated ' + new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
  }catch(e){
    document.getElementById('cond').textContent = 'Offline \u2014 check back soon';
  }
}
load();
setInterval(load, 600000);
</script>
</body>
</html>
