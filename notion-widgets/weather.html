<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indianapolis Weather</title>
<style>
  :root { --crimson:#990000; --cream:#F5EFE0; }
  * { margin:0; box-sizing:border-box; }
  body { font-family: Georgia, 'Times New Roman', serif; background: var(--crimson); color: var(--cream);
         display:flex; align-items:center; justify-content:center; min-height:100vh; padding:14px; }
  .card { width:100%; max-width:520px; border-radius:18px; overflow:hidden;
          box-shadow:0 10px 28px rgba(0,0,0,.4); border:2px solid var(--cream); }
  .top { background:linear-gradient(160deg,#7a0000 0%, var(--crimson) 55%, #b31b1b 100%);
         color:var(--cream); text-align:center; padding:20px 22px 16px; }
  .trident { font-size:22px; }
  .city { font-size:13px; letter-spacing:2px; text-transform:uppercase; opacity:.85; }
  .temp { font-size:58px; font-weight:bold; line-height:1.1; }
  .cond { font-size:16px; font-style:italic; opacity:.95; }
  .facts { display:flex; justify-content:center; gap:18px; margin-top:10px; font-size:11px; letter-spacing:.5px; opacity:.9; }
  .bottom { background:linear-gradient(180deg, #fffdf7 0%, var(--cream) 100%); color:var(--crimson);
            padding:14px 16px 16px; }
  .tl-title { font-size:11px; letter-spacing:1.5px; text-transform:uppercase; opacity:.7; margin-bottom:8px; }
  .timeline { display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; }
  .timeline::-webkit-scrollbar { height:4px; } .timeline::-webkit-scrollbar-thumb { background:rgba(153,0,0,.35); border-radius:4px; }
  .hour { flex:0 0 auto; width:58px; text-align:center; padding:8px 4px; border-radius:12px;
          background:rgba(153,0,0,.06); border:1px solid rgba(153,0,0,.12); }
  .hour .t { font-size:10px; opacity:.7; }
  .hour .i { font-size:20px; margin:4px 0; }
  .hour .tp { font-size:13px; font-weight:bold; }
  .hour .pc { font-size:10px; opacity:.75; }
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="trident">🔱</div>
      <div class="city">Indianapolis, IN</div>
      <div class="temp" id="temp">—°</div>
      <div class="cond" id="cond">Loading…</div>
      <div class="facts">
        <span>Feels <b id="feels">—</b></span>
        <span>Humidity <b id="hum">—</b></span>
        <span>Wind <b id="wind">—</b></span>
      </div>
    </div>
    <div class="bottom">
      <div class="tl-title" id="factline">Today's outlook</div>
      <div class="timeline" id="tl"></div>
    </div>
  </div>
<script>
const ICONS = {0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌧️',61:'🌧️',63:'🌧️',65:'🌧️',66:'🌧️',67:'🌧️',71:'🌨️',73:'🌨️',75:'❄️',77:'🌨️',80:'🌦️',81:'🌧️',82:'🌧️',85:'🌨️',86:'🌨️',95:'⛈️',96:'⛈️',99:'⛈️'};
const LABELS = {0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Fog',51:'Drizzle',53:'Drizzle',55:'Drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',66:'Freezing rain',67:'Freezing rain',71:'Light snow',73:'Snow',75:'Heavy snow',77:'Snow grains',80:'Showers',81:'Showers',82:'Heavy showers',85:'Snow showers',86:'Snow showers',95:'Thunderstorm',96:'Thunderstorm',99:'Thunderstorm'};
const URL='https://api.open-meteo.com/v1/forecast?latitude=39.7684&longitude=-86.1581&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&hourly=temperature_2m,precipitation_probability,weather_code&temperature_unit=fahrenheit&wind_speed_unit=mph&forecast_days=1';
async function load(){
  try{
    const d = await (await fetch(URL)).json();
    const c = d.current;
    document.getElementById('temp').textContent = Math.round(c.temperature_2m)+'\u00b0';
    document.getElementById('cond').textContent = LABELS[c.weather_code]||'\u2014';
    document.getElementById('feels').textContent = Math.round(c.apparent_temperature)+'\u00b0';
    document.getElementById('hum').textContent = c.relative_humidity_2m+'%';
    document.getElementById('wind').textContent = Math.round(c.wind_speed_10m)+' mph';
    // hourly timeline (next 12 hours)
    const now = new Date();
    const tl = document.getElementById('tl');
    tl.innerHTML = '';
    let maxPrecip = 0;
    const h = d.hourly;
    const startIdx = h.time.findIndex(t => new Date(t) > now);
    for (let i = startIdx; i < Math.min(startIdx+12, h.time.length); i++){
      const t = new Date(h.time[i]);
      const code = h.weather_code[i];
      const precip = h.precipitation_probability[i] ?? 0;
      maxPrecip = Math.max(maxPrecip, precip);
      const div = document.createElement('div');
      div.className = 'hour';
      div.innerHTML = `<div class="t">${t.toLocaleTimeString([],{hour:'numeric'})}</div>`+
        `<div class="i">${ICONS[code]||'❓'}</div>`+
        `<div class="tp">${Math.round(h.temperature_2m[i])}\u00b0</div>`+
        `<div class="pc">${precip>0?precip+'% \u2614':''}</div>`;
      tl.appendChild(div);
    }
    const fc = LABELS[c.weather_code]||'';
    document.getElementById('factline').textContent =
      (maxPrecip>0?`Chance of showers \u00b7 up to ${maxPrecip}% \u00b7 `:'') + fc + ' \u00b7 Indy today';
  }catch(e){
    document.getElementById('cond').textContent = 'Offline \u2014 check back soon';
  }
}
load();
setInterval(load, 600000);
</script>
</body>
</html>
